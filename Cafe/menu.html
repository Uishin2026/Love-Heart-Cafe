<body>
    <div id="menu" class="big-bg">
        <header class="page-header wrapper">
            <h1><a href="index.html"><img class="logo" src="Photo/logo.png" alt="LHカフェ　ホーム"></a></h1>
            <input type="checkbox" id="menu-btn-check">
            <label for="menu-btn-check" class="menu-btn">

            <nav>

            </nav>

        <div class="menu-content wrapper">
            <h2 class="page-title">Menu</h2>
            <p>
                Love Heart Cafeが、自信を持ってゲストの皆様に提供する、ブレンドコーヒーとオーガニックフードです。
                オーガニックフードは、地産地消にこだわっております。地域農家が育んだ恵みを頂いて下さい。
            </p>
        </div><!--/.menu-content-->

    <div class="wrapper grid">
        <div class="item">
            <img src="Photo/menu 1.jpg" alt="ブルーベリーを添えた抹茶アイスとフルーツソースのジェラート">
            <p>ジェラート</p>
        </div>
        <div class="item">
            <img src="Photo/menu 2.jpg" alt="カラフルで可愛らしい4種類のマカロン">
            <p>マカロン</p>
        </div>
        <div class="item">
            <img src="Photo/menu 3.jpg" alt="ワッフルボウルに盛り付けられたバニラアイスのチョコソースがけ">
            <p>アイスクリーム</p>
        </div>
        <div class="item">
            <img src="Photo/menu 4.jpg" alt="ナッツとココナッツパウダーをたっぷりトッピングしたパンケーキ">
            <p>パンケーキ</p>
        </div>
        <div class="item">
            <img src="Photo/menu 5.jpg" alt="ふんわり卵をかぶせた特製ナシゴレン風オムライス">

        </div>
        <div class="item">
            <img src="Photo/menu 6.jpg" alt="新鮮なフルーツとバニラアイスを添えた厚切りハニートースト">

        </div>
        <div class="item">
            <img src="Photo/menu 7.jpg" alt="カレー風味の具材とチーズをのせた舟形ピザ風ブレッド">
            <p>ピザ</p>
        </div>
        <div class="item">
            <img src="Photo/menu 8.jpg" alt="ミートボールとハーブのペンネパスタ バゲット添え">
            <p>パスタ</p>

            <img src="Photo/menu 9.jpg" alt="たっぷりのスライスいちごを敷き詰めたレアチーズタルト">
